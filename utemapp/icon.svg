<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4821F"/>
      <stop offset="100%" stop-color="#d4650a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Fondo -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" fill="url(#shine)"/>
  <!-- Borde sutil -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
  <!-- Letra U -->
  <text x="256" y="360" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-size="320" font-weight="900" fill="white" letter-spacing="-15">U</text>
  <!-- Marcador de mapa (pin) en la esquina inferior derecha -->
  <circle cx="390" cy="380" r="55" fill="white" opacity="0.25"/>
  <circle cx="390" cy="380" r="35" fill="#1A2D5A"/>
  <circle cx="390" cy="380" r="14" fill="white"/>
</svg>
